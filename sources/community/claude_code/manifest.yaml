name: claude_code
version: 0.1.0
dsl_version: 3
backend: file
description: >-
  Query Claude Code session history and prompt data from local JSONL.
  Search past prompts, track sessions across projects, and analyze
  usage patterns through SQL.

test_queries:
  - SELECT display, project, "sessionId" FROM claude_code.history LIMIT 3

tables:

  # --------------------------------------------------------------------------
  # claude_code.history — Claude Code prompt history
  # Reads directly from ~/.claude/history.jsonl (no converter needed).
  # --------------------------------------------------------------------------
  - name: history
    description: >-
      Claude Code prompt history. Each row is a user prompt sent to
      Claude Code, with the project path, session ID, and timestamp.
      Data is written by Claude Code at ~/.claude/history.jsonl.
    guide: |
      No required filters. Start with:
        SELECT display, project, "sessionId", timestamp
        FROM claude_code.history LIMIT 20
      Search prompts by keyword:
        SELECT display, project
        FROM claude_code.history
        WHERE display LIKE '%coral%'
      Find sessions for a project:
        SELECT DISTINCT "sessionId", project
        FROM claude_code.history
        WHERE project LIKE '%terminal-3%'
    format: jsonl
    source:
      location: file://~/.claude/history.jsonl
    columns:
      - name: display
        type: Utf8
        nullable: true
        description: User prompt text sent to Claude Code.
      - name: timestamp
        type: Int64
        nullable: true
        description: Unix timestamp in milliseconds when the prompt was sent.
      - name: project
        type: Utf8
        nullable: true
        description: Absolute path to the project directory.
      - name: sessionId
        type: Utf8
        nullable: true
        description: UUID of the Claude Code session.
