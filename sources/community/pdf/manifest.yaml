name: pdf
version: 0.1.0
dsl_version: 3
backend: jsonl
description: >-
  Query text extracted from local PDF documents using pdfplumber.
test_queries:
  - SELECT file_name, page, page_count, length(text) AS char_count FROM pdf.pages LIMIT 5
tables:
  - name: pages
    description: >-
      Text extracted from PDF documents, one row per page.
      Generated by the pdf-to-jsonl.py converter script.
    guide: |
      First convert your PDFs to JSONL:
        pip install pdfplumber
        python scripts/pdf-to-jsonl.py --dir ~/pdfs/ --out ~/.coral/pdf/pages.jsonl

      Then query the extracted text:
        SELECT file_name, page, text FROM pdf.pages
        WHERE file_name = 'resume.pdf' ORDER BY page

      Re-run the converter when PDFs change.
    source:
      location: file://~/.coral/pdf/
      glob: "*.jsonl"
    columns:
      - name: file_name
        type: Utf8
        nullable: false
        description: File name of the source PDF (e.g. resume.pdf).
      - name: path
        type: Utf8
        nullable: false
        description: Absolute filesystem path to the source PDF.
      - name: page
        type: Int64
        nullable: false
        description: Page number within the PDF (1-indexed).
      - name: page_count
        type: Int64
        nullable: false
        description: Total number of pages in the document.
      - name: text
        type: Utf8
        nullable: false
        description: Full text content extracted from the page via pdfplumber.
      - name: metadata
        type: Json
        nullable: true
        description: PDF metadata (author, title, subject, producer, etc.).
