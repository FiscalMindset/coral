name: pdf
version: 0.1.0
dsl_version: 3
backend: jsonl
description: >-
  Query text, tables, images, and structure from local PDF documents
  using PyMuPDF extraction.
test_queries:
  - SELECT file_name, page, page_count, length(text) AS char_count FROM pdf.pages LIMIT 5
tables:
  - name: pages
    description: >-
      Text, tables, images, and structure extracted from PDF documents,
      one row per page. Generated by the pdf-to-jsonl.py converter script
      using PyMuPDF.
    guide: |
      First convert your PDFs to JSONL:
        pip install pymupdf
        python sources/community/pdf/scripts/pdf-to-jsonl.py --dir ~/pdfs/

      Then query the extracted data:
        SELECT file_name, page, text FROM pdf.pages
        WHERE file_name = 'resume.pdf' ORDER BY page

        -- Search within structured blocks
        SELECT blocks FROM pdf.pages
        WHERE file_name = 'report.pdf'

        -- Find pages containing tables
        SELECT file_name, page FROM pdf.pages
        WHERE json_array_length(tables) > 0

      Re-run the converter when PDFs change.
    source:
      location: file://~/.coral/pdf/
      glob: "*.jsonl"
    columns:
      - name: file_name
        type: Utf8
        nullable: false
        description: File name of the source PDF (e.g. resume.pdf).
      - name: path
        type: Utf8
        nullable: false
        description: Absolute filesystem path to the source PDF.
      - name: page
        type: Int64
        nullable: false
        description: Page number within the PDF (1-indexed).
      - name: page_count
        type: Int64
        nullable: false
        description: Total number of pages in the document.
      - name: text
        type: Utf8
        nullable: false
        description: Full plain text content extracted from the page.
      - name: markdown
        type: Utf8
        nullable: false
        description: Structured markdown preserving headings, bold, and italic formatting.
      - name: blocks
        type: Json
        nullable: false
        description: JSON array of text blocks with position (x0,y0,x1,y1), font name, size, bold, italic, and color.
      - name: tables
        type: Json
        nullable: false
        description: JSON array of extracted tables with header row and data rows.
      - name: images
        type: Json
        nullable: false
        description: JSON array of image references with width, height, and xref.
      - name: metadata
        type: Json
        nullable: true
        description: PDF document metadata (author, title, subject, producer, creation date, etc.).
