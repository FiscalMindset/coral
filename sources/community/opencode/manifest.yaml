name: opencode
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query a running `opencode serve` HTTP server through SQL: session
  metadata (titles, projects, directories, agents, models, token and
  cost totals), the AI providers the server has configured, and the
  permission rules it has saved. Read-only.
base_url: "{{input.OPENCODE_URL}}"
inputs:
  OPENCODE_URL:
    kind: variable
    default: http://127.0.0.1:14096
    hint: >-
      Base URL of a running `opencode serve` instance. Start one locally
      with `opencode serve --port 14096 --hostname 127.0.0.1`; the
      default hostname keeps the server reachable only from this host.
      Password-protected servers (those started with the
      `OPENCODE_SERVER_PASSWORD` environment variable) are not yet
      supported; run `opencode serve` without that env var for v0.1.0.
test_queries:
  - SELECT id, title FROM opencode.sessions LIMIT 3
  - SELECT id, name FROM opencode.providers LIMIT 5
tables:
  - name: sessions
    description: >-
      All OpenCode sessions known to the server, ordered by the server's
      default cursor (most recent activity first).
    guide: |
      Reads `GET /api/session` and pages through the opaque `cursor.next`
      value automatically. One row per session. Pair with the
      `session(id)` table function to fetch full detail for a single
      session.
    request:
      method: GET
      path: /api/session
    response:
      rows_path:
        - data
    pagination:
      mode: cursor_query
      page_size:
        default: 50
        max: 500
        query_param: limit
      cursor_param: cursor
      response_cursor_path:
        - cursor
        - next
      max_pages: 50
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Session id (starts with `ses_`).
        expr:
          kind: path
          path:
            - id
      - name: title
        type: Utf8
        nullable: true
        description: Human-readable session title, often the first user prompt.
        expr:
          kind: path
          path:
            - title
      - name: slug
        type: Utf8
        nullable: true
        description: Short slug derived from the title.
        expr:
          kind: path
          path:
            - slug
      - name: project_id
        type: Utf8
        nullable: true
        description: OpenCode project id the session belongs to.
        expr:
          kind: path
          path:
            - projectID
      - name: directory
        type: Utf8
        nullable: true
        description: Working-directory path the session ran in.
        expr:
          kind: path
          path:
            - location
            - directory
      - name: subpath
        type: Utf8
        nullable: true
        description: Subpath within the directory, when set.
        expr:
          kind: path
          path:
            - subpath
      - name: parent_id
        type: Utf8
        nullable: true
        description: Parent session id for forked or sub-agent sessions.
        expr:
          kind: path
          path:
            - parentID
      - name: agent
        type: Utf8
        nullable: true
        description: OpenCode agent name (e.g. `build`, `general`, `explore`).
        expr:
          kind: path
          path:
            - agent
      - name: model_id
        type: Utf8
        nullable: true
        description: Model id used by the session (provider-specific).
        expr:
          kind: path
          path:
            - model
            - id
      - name: model_provider
        type: Utf8
        nullable: true
        description: Provider id (e.g. `anthropic`, `openai`, `opencode`).
        expr:
          kind: path
          path:
            - model
            - providerID
      - name: model_variant
        type: Utf8
        nullable: true
        description: Model variant when the provider exposes one.
        expr:
          kind: path
          path:
            - model
            - variant
      - name: cost
        type: Float64
        nullable: true
        description: Cumulative session cost in USD as reported by the server.
        expr:
          kind: path
          path:
            - cost
      - name: tokens_input
        type: Int64
        nullable: true
        description: Total input tokens (excludes cached re-reads).
        expr:
          kind: path
          path:
            - tokens
            - input
      - name: tokens_output
        type: Int64
        nullable: true
        description: Total output tokens.
        expr:
          kind: path
          path:
            - tokens
            - output
      - name: tokens_reasoning
        type: Int64
        nullable: true
        description: Reasoning tokens when the provider reports them.
        expr:
          kind: path
          path:
            - tokens
            - reasoning
      - name: tokens_cache_read
        type: Int64
        nullable: true
        description: Prompt-cache tokens read during the session.
        expr:
          kind: path
          path:
            - tokens
            - cache
            - read
      - name: tokens_cache_write
        type: Int64
        nullable: true
        description: Prompt-cache tokens written during the session.
        expr:
          kind: path
          path:
            - tokens
            - cache
            - write
      - name: version
        type: Utf8
        nullable: true
        description: OpenCode schema/version string for the session payload.
        expr:
          kind: path
          path:
            - version
      - name: created
        type: Int64
        nullable: true
        description: Session creation timestamp in epoch milliseconds.
        expr:
          kind: path
          path:
            - time
            - created
      - name: updated
        type: Int64
        nullable: true
        description: Last activity timestamp in epoch milliseconds.
        expr:
          kind: path
          path:
            - time
            - updated
  - name: providers
    description: >-
      AI providers known to the running opencode server, from
      `GET /api/provider`. One row per provider.
    guide: |
      Lists providers configured for the opencode server's default
      location. The `request` field, which may carry an `apiKey`, is
      intentionally excluded.
    request:
      method: GET
      path: /api/provider
    response:
      rows_path:
        - data
    pagination:
      mode: none
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Provider id (e.g. `anthropic`, `openai`, `opencode`).
        expr:
          kind: path
          path:
            - id
      - name: name
        type: Utf8
        nullable: true
        description: Human-readable provider name.
        expr:
          kind: path
          path:
            - name
      - name: api_type
        type: Utf8
        nullable: true
        description: Provider API type (e.g. `aisdk`, `custom`).
        expr:
          kind: path
          path:
            - api
            - type
      - name: api_package
        type: Utf8
        nullable: true
        description: AI SDK package used to talk to the provider.
        expr:
          kind: path
          path:
            - api
            - package
      - name: api_url
        type: Utf8
        nullable: true
        description: Provider base URL.
        expr:
          kind: path
          path:
            - api
            - url
      - name: api_settings
        type: Json
        nullable: true
        description: Provider-specific settings object.
        expr:
          kind: path
          path:
            - api
            - settings

  - name: saved_permissions
    description: >-
      Saved permission rules from `GET /api/permission/saved`. One row
      per rule.
    guide: |
      Lists permission rules the opencode server has remembered for a
      project. May be empty when no rules have been saved.
    request:
      method: GET
      path: /api/permission/saved
    response:
      rows_path:
        - data
    pagination:
      mode: none
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Saved permission rule id.
        expr:
          kind: path
          path:
            - id
      - name: project_id
        type: Utf8
        nullable: true
        description: Project id the rule applies to.
        expr:
          kind: path
          path:
            - projectID
      - name: action
        type: Utf8
        nullable: true
        description: Permission action (`allow`, `deny`, or `ask`).
        expr:
          kind: path
          path:
            - action
      - name: resource
        type: Utf8
        nullable: true
        description: Resource glob the rule matches.
        expr:
          kind: path
          path:
            - resource

functions:
  - name: session
    kind: table
    description: >-
      Full detail for one OpenCode session, fetched from
      `GET /api/session/{sessionID}`.
    guide: |
      Pass the session id: `SELECT * FROM opencode.session(id => 'ses_...')`.
      Returns the same column shape as the `sessions` table for a single
      row.
    args:
      - name: id
        required: true
        bind:
          arg: id
    request:
      method: GET
      path: /api/session/{{arg.id}}
    response:
      rows_path:
        - data
    pagination:
      mode: none
    columns:
      - name: id
        type: Utf8
        nullable: false
        expr:
          kind: path
          path:
            - id
      - name: title
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - title
      - name: slug
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - slug
      - name: project_id
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - projectID
      - name: directory
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - location
            - directory
      - name: subpath
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - subpath
      - name: parent_id
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - parentID
      - name: agent
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - agent
      - name: model_id
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - model
            - id
      - name: model_provider
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - model
            - providerID
      - name: model_variant
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - model
            - variant
      - name: cost
        type: Float64
        nullable: true
        expr:
          kind: path
          path:
            - cost
      - name: tokens_input
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - tokens
            - input
      - name: tokens_output
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - tokens
            - output
      - name: tokens_reasoning
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - tokens
            - reasoning
      - name: tokens_cache_read
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - tokens
            - cache
            - read
      - name: tokens_cache_write
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - tokens
            - cache
            - write
      - name: version
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - version
      - name: created
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - time
            - created
      - name: updated
        type: Int64
        nullable: true
        expr:
          kind: path
          path:
            - time
            - updated
